# The /v2 API as a container. The host's Caddy terminates HTTPS and proxies to
# 127.0.0.1:${NOTCH_HOST_PORT:-4131}. Secrets come from .env and the Apple key from
# secrets/apple-signin.p8; both are gitignored and copied to the VPS with scp.
# DEPLOY.md › "Run it as a container".
#
#   docker compose up -d --build                        # the VPS: prod, port 4131
#   NOTCH_ENV=dev NOTCH_HOST_PORT=4175 docker compose up --build   # the Mac: api.notch.localhost
services:
  api:
    build: .
    image: notch-api:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false                        # prod still refuses to start without its secrets
    environment:
      NOTCH_ENV: ${NOTCH_ENV:-prod}
      NOTCH_FAKE_MODELS: ${NOTCH_FAKE_MODELS:-}  # 1 = offline doubles; refused in prod
      NOTCH_DEV_AUTH: ${NOTCH_DEV_AUTH:-}        # 1 = `Bearer dev`; refused in prod
      NOTCH_HOST: 0.0.0.0
      NOTCH_PORT: "4131"
      NOTCH_METER_DB: /data/meter.db
      NOTCH_TMP: /tmp/notch
      NOTCH_METRICS: /data/metrics.jsonl       # metadata only: one line per model call
      NOTCH_DB: /data/v1.db                    # /v1 exists only when NOTCH_ENV isn't prod
      NOTCH_AUDIO_DIR: /data/v1-audio
      APPLE_PRIVATE_KEY_PATH: /run/notch-secrets/apple-signin.p8
    ports:
      - "127.0.0.1:${NOTCH_HOST_PORT:-4131}:4131"
      # The dashboard shares this container's network (`dash` below), so its port is published here.
      - "127.0.0.1:${NOTCH_DASH_HOST_PORT:-4130}:4130"
    volumes:
      - meter:/data
      - ./secrets:/run/notch-secrets:ro
    tmpfs:
      - /tmp/notch:size=512m,mode=0700,uid=10001,gid=10001
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 3g

  # The dashboard (DASHBOARD.md): metadata only, read-only, from the same image. It shares the
  # api container's network, so its /healthz probe on 127.0.0.1:4131 reaches the server, and it
  # reads the `meter` volume: `/` is the fleet's usage (who used Notch, how much, how fast, at
  # what cost), from the meter database. On the VPS, Caddy serves it at
  # dash.trynotch.xyz behind a password and compose.override.yaml (untracked) sets
  # NOTCH_DASH_AUTH_PROXY=1 so it trusts that gate; anywhere else it answers this machine only.
  dash:
    image: notch-api:latest
    command: ["python", "-m", "notch_dash"]
    restart: unless-stopped
    depends_on: [api]
    network_mode: "service:api"
    environment:
      NOTCH_DASH_BIND: 0.0.0.0
      NOTCH_DASH_PORT: "4130"
      NOTCH_DASH_HOSTS: ${NOTCH_DASH_HOSTS:-dash.trynotch.xyz}
      NOTCH_DASH_AUTH_PROXY: ${NOTCH_DASH_AUTH_PROXY:-}
      NOTCH_PORT: "4131"
      NOTCH_METRICS: /data/metrics.jsonl       # one line per model call: kind, model, latency, cost
      NOTCH_DASH_METER_DB: /data/meter.db      # the fleet's usage (notch_dash/usage.py), opened mode=ro
      NOTCH_DASH_HOME: usage                   # `/` is the usage page; this stack's health is at /harness
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}  # spend only (GET /api/v1/key)
      # The v1 harness's sources don't exist here: off, so the page says so.
      NOTCH_DB: ""
      NOTCH_AUDIO_DIR: ""
      NOTCH_DASH_CADDY_LOG: ""
      NOTCH_DASH_SERVER_LOG: ""
      NOTCH_DASH_TUNNEL_LOG: ""
      NOTCH_DASH_TUNNEL_METRICS: ""
      NOTCH_DASH_GATE_SECRET_FILE: ""
      NOTCH_DASH_DEVICE: ""
    volumes:
      # Read-write, though nothing here writes: the meter is WAL-mode SQLite, whose readers need its
      # -shm file, and a read-only mount cannot create it while the server is idle. The dashboard
      # opens the database with mode=ro and only reads metrics.jsonl.
      - meter:/data
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 512m

volumes:
  meter:
